# Owl sprite geometry. See tools/prepare-character-sprites.sh for the keys.
# The eyes sit at roughly x 70-130, y 75-100 of the 192px frame; the beak
# just below, so the talking face box extends further down.
face_width=68
face_height=36
face_x=64
face_y=70
talk_source="$character_dir/concepts/owl-talk-strip-v1.png"
# Only the beak is swapped in from the talk copies; their eyes and outlines
# differ slightly from the idle sheet and would jitter if pasted too.
talk_face_x=90
talk_face_y=88
talk_face_width=22
talk_face_height=30
# The rectangular concept crop includes turquoise eye edges. This face-only
# contour encloses all three beaks and their clearing margin, not either eye.
talk_face_mask="5,2 14,2 17,9 21,13 21,23 15,29 5,29 0,21 0,12 4,7"
flight_extra_sources=("$character_dir/concepts/owl-flight-down-v1.png")
point_up_mode="concept"
alpha_cutoff="50%"
frame_align="column"
# Eyes in the pointing frames.
point_face="90x44+48+54"
point_up_face="84x42+50+54"
# Alternate the neutral copy with the two cleanest open-beak copies.
talk_frame_order="0 1 0 3 0 1 0 3"
