name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      prepare_release: true
    permissions:
      contents: read

  publish:
    name: Publish verified release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified files from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: candidate
      - name: Check artifact integrity and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release already exists; refusing to replace it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag --latest \
            --title "Learn Omarchy $RELEASE_TAG" \
            --notes-file RELEASE-NOTES.md \
            ./*.tar.gz ./*.pkg.tar.zst PKGBUILD SRCINFO \
            SHA256SUMS BUILD-INFO.txt VERIFICATION.json RELEASE-NOTES.txt RELEASE-NOTES.md
          mkdir ../uploaded
          gh release download "$RELEASE_TAG" --dir ../uploaded
          cd ../uploaded
          sha256sum --check SHA256SUMS
